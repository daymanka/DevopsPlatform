# Use postgres/example user/password credentials

services:

  db:
    image: postgres
    restart: always
    container_name: postgresContainer
    ports:
      - 5432:5432
    volumes:
      - pgdata:/var/lib/postgresql
    # set shared memory limit when using docker compose
    shm_size: 128mb
    # or set shared memory limit when deploy via swarm stack
    #volumes:
    #  - type: tmpfs
    #    target: /dev/shm
    #    tmpfs:
    #      size: 134217728 # 128*2^20 bytes = 128Mb
    environment:
      POSTGRES_PASSWORD: admin
      POSTGRES_USER: devops
      POSTGRES_DB: devopsdb

  backend:
    build: .
    container_name: devops-back
    ports:
      - 8080:8080
    depends_on:
      - db
    environment:
      DB_URL: jdbc:postgresql://db:5432/devopsdb
      DB_USERNAME: devops
      DB_PASSWORD: admin


  adminer:
    image: adminer
    restart: always
    ports:
      - 8081:8080

volumes:
  pgdata:
